# ──────────────────────────────────────────────────────────
#  MEJORA: Dependency Review
#  RAZÓN: Bloquea PRs que introduzcan dependencias con
#         vulnerabilidades conocidas (CVE).
#  IMPACTO: Previene supply-chain attacks antes del merge.
# ──────────────────────────────────────────────────────────

name: "Dependency Review"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always
