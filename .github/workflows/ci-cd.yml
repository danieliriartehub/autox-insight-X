# ──────────────────────────────────────────────────────────
#  MEJORA: CI/CD Pipeline completo — AutoX Insight X
#  RAZÓN: Automatiza lint, typecheck, tests, análisis de
#         seguridad (SonarQube, OWASP ZAP) y deploy a
#         Vercel + Railway. Cada push a main o PR dispara
#         el pipeline completo con quality gates.
#  IMPACTO: Zero-touch deployment. Calidad garantizada antes
#           de llegar a producción. Tiempo de feedback <5 min.
# ──────────────────────────────────────────────────────────

name: AutoX CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # ════════════════════════════════════════════════════════
  #  JOB 1: Quality — Lint, TypeCheck, Tests, Coverage
  # ════════════════════════════════════════════════════════
  quality:
    name: "Quality & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint
        # ── RAZÓN: ESLint detecta problemas de sintaxis,
        #    lógica y buenas prácticas antes de compilar ──

      - name: Prettier Check
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "api/**/*.py"
        # ── RAZÓN: Asegura formato consistente sin
        #    discusiones de estilo en code review ──
        continue-on-error: true

      - name: TypeScript TypeCheck
        run: npx tsc --noEmit
        # ── RAZÓN: TypeScript estricto atrapa errores de
        #    tipos que pasarían desapercibidos en JS puro ──

      - name: Unit & Functional Tests
        run: npm run test -- --coverage
        # ── RAZÓN: Vitest corre 20+ tests con cobertura.
        #    El flag --coverage genera reporte para SonarQube ──

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ── RAZÓN: SonarCloud analiza bugs, code smells,
        #    vulnerabilidades y duplicados. Quality Gate
        #    bloquea si no se cumplen los thresholds ──
        continue-on-error: false

  # ════════════════════════════════════════════════════════
  #  JOB 2: Security — Dependency Audit
  # ════════════════════════════════════════════════════════
  security-audit:
    name: "Security — Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        run: npm audit --audit-level=high || true
        # ── RAZÓN: npm audit revisa vulnerabilidades en
        #    dependencias frontend. No falla el pipeline
        #    para no bloquear, pero se monitorea ──

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Safety check (backend)
        run: |
          pip install safety
          safety check -r api/requirements.txt --full-report || true
        # ── RAZÓN: Safety revisa vulnerabilidades en
        #    dependencias Python (FastAPI, XGBoost, etc.) ──

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
        # ── RAZÓN: Trivy escanea IaC, secrets expuestos,
        #    y vulnerabilidades en el código mismo ──

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

  # ════════════════════════════════════════════════════════
  #  JOB 3: Docker Build & Integration Test
  # ════════════════════════════════════════════════════════
  docker-integration:
    name: "Docker Build & Integration Tests"
    needs: [quality, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t autox-frontend:ci .

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t autox-backend:ci .

      - name: Start services with Docker Compose
        run: |
          docker compose -f docker-compose.yml up -d postgres-test
          docker run -d --name backend-ci \
            --network autox-network \
            -p 8000:8000 \
            -e SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            -e SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }} \
            autox-backend:ci
          docker run -d --name frontend-ci \
            --network autox-network \
            -p 3000:3000 \
            -e VITE_API_URL=http://backend-ci:8000 \
            autox-frontend:ci

      - name: Wait for backend health
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && echo " Backend ready" && break
            echo "Attempt $i/30..."
            sleep 2
          done

      - name: Wait for frontend health
        run: |
          echo "Waiting for frontend..."
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000 && echo " Frontend ready" && break
            echo "Attempt $i/15..."
            sleep 2
          done

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: "http://localhost:8000"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          cmd_options: "-a -j"
          allow_issue_writing: false
          fail_action: false
        # ── RAZÓN: ZAP escanea la API en el host gracias a -p 8000:8000 ──
        # ── RAZÓN: ZAP escanea vulnerabilidades OWASP Top 10
        #    en la API en ejecución real (DAST). No bloquea
        #    el pipeline pero genera reporte ──

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-report.html
          retention-days: 7

      - name: Integration Test (API)
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"codigo_repuesto":"FILTRO01","mes":6,"km":15000}')
          echo "API Response: $RESPONSE"
          echo "$RESPONSE" | grep -q "cantidad_estimada" && echo " Integration test PASSED" || exit 1

      - name: Cleanup
        if: always()
        run: |
          docker stop backend-ci frontend-ci || true
          docker rm backend-ci frontend-ci || true
          docker compose -f docker-compose.yml down -v || true

  # ════════════════════════════════════════════════════════
  #  JOB 4: Deploy (solo en push a main)
  # ════════════════════════════════════════════════════════
  deploy:
    name: "Deploy to Production"
    if: github.ref == 'refs/heads/main'
    needs: [docker-integration]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy Frontend → Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --token=${{ secrets.VERCEL_FRONTEND_TOKEN }} --environment=production
          vercel build --prod --token=${{ secrets.VERCEL_FRONTEND_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_FRONTEND_TOKEN }}
        # ── RAZÓN: Vercel deploy con token de API.
        #    --prebuilt evita reconstruir en la nube ──

      - name: Deploy Backend → Railway
        run: |
          npm install -g @railway/cli
          railway login --token ${{ secrets.RAILWAY_BACKEND_TOKEN }}
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway up --service backend
        # ── RAZÓN: Railway deploy con token de API.
        #    railway up despliega la última versión ──

      - name: Post-Deploy Health Check
        run: |
          echo "Waiting for production backend..."
          sleep 15
          curl --retry 10 --retry-delay 10 \
            https://autox-insight-backend-production.up.railway.app/health
        # ── RAZÓN: Verifica que el deploy fue exitoso
        #    consultando el health endpoint real ──

  # ════════════════════════════════════════════════════════
  #  JOB 5: Quality Gate Summary (reporte final)
  # ════════════════════════════════════════════════════════
  quality-gate:
    name: "Quality Gate Summary"
    if: always()
    needs: [quality, security-audit, docker-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check previous jobs
        run: |
          echo "✅ Quality: ${{ needs.quality.result }}"
          echo "✅ Security: ${{ needs.security-audit.result }}"
          echo "✅ Integration: ${{ needs.docker-integration.result }}"
          if [[ "${{ needs.quality.result }}" == "success" && \
                "${{ needs.security-audit.result }}" == "success" && \
                "${{ needs.docker-integration.result }}" == "success" ]]; then
            echo "✅ ALL QUALITY GATES PASSED"
          else
            echo "⚠️  SOME QUALITY GATES FAILED — review logs above"
            exit 1
          fi
