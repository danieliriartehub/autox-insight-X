# ──────────────────────────────────────────────────────────
#  MEJORA: Configuración SonarQube / SonarCloud
#  RAZÓN: SonarQube necesita saber qué analizar, dónde está
#         el código fuente, qué lenguaje y cómo interpretar
#         los reportes de cobertura de tests.
#  IMPACTO: Calidad gate automática. Detección temprana de
#           bugs, code smells, vulnerabilidades y duplicados.
# ──────────────────────────────────────────────────────────

sonar.projectKey=autox-insight-X
sonar.organization=danieliriartehub
sonar.host.url=https://sonarcloud.io

# ── Sources ───────────────────────────────────────────────
sonar.sources=src/,api/
sonar.exclusions=**/*.gen.ts,**/ui/**,**/*.test.*,**/*.spec.*,tests/**

# ── Tests & Coverage ─────────────────────────────────────
sonar.tests=tests/
sonar.test.inclusionPatterns=**/*.test.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage/coverage.xml

# ── Quality Gate thresholds (se validan en el pipeline) ──
sonar.coverage.exclusions=tests/**/*,src/**/*.gen.ts,src/components/ui/**
sonar.typescript.exclusions=src/routeTree.gen.ts

# ── Duplicación ──────────────────────────────────────────
sonar.cpd.exclusions=src/**/*.gen.ts,src/components/ui/**,src/routeTree.gen.ts,src/lib/registry.ts
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.tsx
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=api/**
