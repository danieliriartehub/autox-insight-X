# ──────────────────────────────────────────────────────────
#  MEJORA: Configuración nginx para SPA (Single Page App)
#  RAZÓN: React Router maneja rutas del lado cliente.
#         nginx debe redirigir todo al index.html para que
#         el router cliente funcione correctamente.
#  IMPACTO: Soporte de deep linking (F5 en cualquier ruta).
#           Cacheo de assets estáticos con hash para máximo rendimiento.
#           Headers de seguridad OWASP ZAP compliant.
# ──────────────────────────────────────────────────────────

server {
    listen 3000;
    server_name _ localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Seguridad: headers recomendados por OWASP ──────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://autox-insight-backend-production.up.railway.app wss://*.supabase.co ws://localhost:8080; font-src 'self' data:;" always;

    # ── SPA: todo lo que no sea asset estático → index.html ─
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # ── Assets con hash: cacheo perpetuo ───────────────
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
